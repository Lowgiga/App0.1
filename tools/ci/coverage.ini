# Branch coverage for the Python tools (CI: COVERAGE_RCFILE=tools/ci/coverage.ini, see .github/workflows/ci.yml).
# Deliberately not named .coveragerc: "rm .coverage*" (cleaning data files) deleted it twice.
[run]
branch = True
source = tools
omit = */test_*.py

[report]
show_missing = True
fail_under = 98
exclude_also =
    if __name__ == .__main__.:
