<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1310" viewBox="0 0 560 1310" role="img" aria-labelledby="title desc">
  <title id="title">LowQuantFlow: von der Idee zum Ergebnis</title>
  <desc id="desc">Konzept und Zielbild, kein Implementierungsnachweis. Der Arbeitsweg: Idee, Auftrag, Prüfen, Review und Ergebnis. 3D-Begleiter und Video-Studio sind optionale geplante Module.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071123"/><stop offset="1" stop-color="#12122e"/></linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="188" x2="0" y2="1008"><stop stop-color="#6cedff"/><stop offset=".5" stop-color="#90adff"/><stop offset="1" stop-color="#cf9dff"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13243e"/><stop offset="1" stop-color="#171a37"/></linearGradient>
    <filter id="glow" x="-100%" y="-25%" width="300%" height="150%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="560" height="1310" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="558" height="1308" rx="23" fill="none" stroke="#3a4a6a"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="34" y="56" fill="#81edff" font-size="25" font-weight="700">LOWQUANTFLOW</text>
    <text x="34" y="105" fill="#f1f6ff" font-size="37" font-weight="700">Von Idee zu Ergebnis</text>
    <text x="34" y="146" fill="#c5cce0" font-size="24">Konzept · Zielbild des Arbeitswegs</text>
    <path d="M57 252V956" fill="none" stroke="#62c9ff" stroke-width="12" opacity=".2" filter="url(#glow)"/>
    <path d="M57 252V956" fill="none" stroke="url(#flow)" stroke-width="3"/>
    <g>
      <rect x="96" y="188" width="430" height="140" rx="16" fill="url(#panel)" stroke="#397891" stroke-width="1.5"/>
      <rect x="96" y="208" width="4" height="44" rx="2" fill="#6cedff"/>
      <circle cx="57" cy="237" r="26" fill="#101f37" stroke="#6cedff" stroke-width="2"/>
      <text x="57" y="245" text-anchor="middle" fill="#eef8ff" font-size="24" font-weight="700">01</text>
      <text x="120" y="231" fill="#f1f6ff" font-size="34" font-weight="700">Idee</text>
      <text x="120" y="270" fill="#e0e8f9" font-size="24">Ziel erkennen</text>
      <text x="120" y="302" fill="#c5cce0" font-size="24">Fragen und Quellen sammeln</text>
      <path d="m50 338 7 8 7-8" fill="none" stroke="#aebcef" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="96" y="358" width="430" height="140" rx="16" fill="url(#panel)" stroke="#397891" stroke-width="1.5"/>
      <rect x="96" y="378" width="4" height="44" rx="2" fill="#6cedff"/>
      <circle cx="57" cy="407" r="26" fill="#101f37" stroke="#6cedff" stroke-width="2"/>
      <text x="57" y="415" text-anchor="middle" fill="#eef8ff" font-size="24" font-weight="700">02</text>
      <text x="120" y="401" fill="#f1f6ff" font-size="34" font-weight="700">Auftrag</text>
      <text x="120" y="440" fill="#e0e8f9" font-size="24">Umfang begrenzen</text>
      <text x="120" y="472" fill="#c5cce0" font-size="24">Schritte und Abnahme klären</text>
      <path d="m50 508 7 8 7-8" fill="none" stroke="#aebcef" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g>
