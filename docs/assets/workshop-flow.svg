      <text x="120" y="571" fill="#f1f6ff" font-size="34" font-weight="700">Prüfen</text>
      <text x="120" y="610" fill="#e0e8f9" font-size="24">Wirkung verstehen</text>
      <text x="120" y="642" fill="#c5cce0" font-size="24">Annahmen und Varianten prüfen</text>
      <path d="m50 678 7 8 7-8" fill="none" stroke="#aebcef" stroke-width="2.5" stroke-linecap="round"/>
    </g>
