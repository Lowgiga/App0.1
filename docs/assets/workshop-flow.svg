      <text x="57" y="755" text-anchor="middle" fill="#eef8ff" font-size="24" font-weight="700">04</text>
      <text x="120" y="741" fill="#f1f6ff" font-size="34" font-weight="700">Review</text>
      <text x="120" y="780" fill="#e0e8f9" font-size="24">Befunde belegen</text>
      <text x="120" y="812" fill="#c5cce0" font-size="24">Entscheidungen bewusst treffen</text>
      <path d="m50 848 7 8 7-8" fill="none" stroke="#aebcef" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="96" y="868" width="430" height="140" rx="16" fill="url(#panel)" stroke="#8868b0" stroke-width="1.5"/>
      <rect x="96" y="888" width="4" height="44" rx="2" fill="#cf9dff"/>
      <circle cx="57" cy="917" r="26" fill="#101f37" stroke="#cf9dff" stroke-width="2"/>
      <text x="57" y="925" text-anchor="middle" fill="#eef8ff" font-size="24" font-weight="700">05</text>
      <text x="120" y="911" fill="#f1f6ff" font-size="34" font-weight="700">Ergebnis</text>
      <text x="120" y="950" fill="#e0e8f9" font-size="24">Nächsten Schritt festhalten</text>
      <text x="120" y="982" fill="#c5cce0" font-size="24">Freigegebene Resultate nutzen</text>

    </g>
    <rect x="34" y="1052" width="492" height="216" rx="16" fill="#1c1937" stroke="#b38bde" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="56" y="1095" fill="#dcc2fb" font-size="24" font-weight="700">OPTIONAL · GEPLANT</text>
    <text x="56" y="1135" fill="#f1f6ff" font-size="29" font-weight="700">3D-Begleiter</text>
    <text x="56" y="1169" fill="#d0c8e3" font-size="24">Abschaltbare räumliche Begleitung</text>
    <text x="56" y="1210" fill="#f1f6ff" font-size="29" font-weight="700">Video-Studio</text>
    <text x="56" y="1244" fill="#d0c8e3" font-size="24">Separater Medienarbeitsbereich</text>
  </g>
