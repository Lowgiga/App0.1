<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">LowQuantFlow – Ideen verbinden. Klar weiterbauen.</title>
  <desc id="desc">Originale Konzeptgrafik: fünf leuchtende Projektknoten und cyan-violette Datenwellen über einer räumlichen Werkstatt. Kein App-Screenshot und kein Buildstatus.</desc>
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b1b"/><stop offset=".55" stop-color="#0b1631"/><stop offset="1" stop-color="#100d2c"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#196293" stop-opacity=".65"/><stop offset=".5" stop-color="#142b61" stop-opacity=".4"/><stop offset="1" stop-color="#0b1026" stop-opacity="0"/></radialGradient>
    <linearGradient id="stream" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="600"><stop stop-color="#61f3ff"/><stop offset=".47" stop-color="#5a9cff"/><stop offset="1" stop-color="#cb86ff"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#dffbff"/><stop offset="1" stop-color="#c4b4ff"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c697f"/><stop offset="1" stop-color="#1b295a"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183554"/><stop offset="1" stop-color="#100d2e"/></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="dotgrid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#608bc5" opacity=".19"/></pattern>
    <path id="wave1" d="M-80 448C40 212 178 570 329 375S596 229 730 365 909 491 1032 286"/>
    <path id="wave2" d="M-62 484C92 288 177 532 363 427S586 270 733 391 895 477 1030 331"/>
    <path id="wave3" d="M-48 385C146 218 154 505 344 362S605 309 757 427 957 431 1027 382"/>
    <g id="small-node">
      <ellipse cx="0" cy="46" rx="61" ry="19" fill="#33dafa" opacity=".12" filter="url(#soft)"/>
      <path d="M0-29 42-5 0 20-42-5Z" fill="url(#top)" stroke="#6dd9f6" stroke-width="1.5"/>
      <path d="M-42-5 0 20 0 61-42 36Z" fill="url(#face)" stroke="#367390" stroke-width="1.2"/>
      <path d="M0 20 42-5 42 36 0 61Z" fill="#191844" stroke="#7565be" stroke-width="1.2"/>
      <path d="M-26 1 0 16 27 0M0 28V48" fill="none" stroke="#80eaff" stroke-width="2" opacity=".85"/>
      <circle cy="-5" r="7" fill="#c6fbff" filter="url(#glow)"/>
      <circle class="pulse" cy="-5" r="15" fill="none" stroke="#64efff" stroke-width="2" opacity=".62"/>
    </g>
  </defs>
  <rect width="960" height="600" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="598" rx="23" fill="none" stroke="#324267"/>
  <rect x="16" y="16" width="928" height="568" rx="16" fill="url(#dotgrid)"/>
  <ellipse cx="496" cy="336" rx="500" ry="300" fill="url(#aura)"/>
  <ellipse cx="780" cy="454" rx="245" ry="140" fill="#783dfa" opacity=".1" filter="url(#soft)"/>
  <!-- All tiny grid marks and waves are decorative; no status is encoded. -->
  <g fill="none" stroke="#385986" stroke-width="1" opacity=".28">
    <path d="M90 526 479 260 895 526M185 542 479 260 795 542M314 555 479 260 656 555M479 260V566"/>
    <path d="M273 398H690M215 438H754M152 482H826M85 528H898"/>
