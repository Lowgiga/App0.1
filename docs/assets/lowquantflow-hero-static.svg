  </g>
  <g transform="translate(158 357)"><use href="#small-node"/></g>
  <g transform="translate(298 279) scale(.82)"><use href="#small-node"/></g>
  <g transform="translate(684 275) scale(.82)"><use href="#small-node"/></g>
  <g transform="translate(812 368)"><use href="#small-node"/></g>
