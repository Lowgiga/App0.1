    <use href="#wave1" stroke-width="1.8" opacity=".8"/>
    <use href="#wave2" stroke-width="1.2" opacity=".4"/>
    <use href="#wave3" stroke-width="1.2" opacity=".4"/>
    <use class="travel" href="#wave1" stroke-width="5" stroke-dasharray="48 190" stroke-dashoffset="0" opacity=".9" filter="url(#glow)"/>
    <use class="travel-back" href="#wave3" stroke-width="3" stroke-dasharray="20 140" stroke-dashoffset="0" opacity=".65" filter="url(#glow)"/>
  </g>
