    <text x="52" y="173" fill="#b5c9e4" font-size="36" letter-spacing=".1">Ideen verbinden. Klar weiterbauen.</text>
  </g>
  <g fill="none" stroke="url(#stream)" stroke-width="3" stroke-linecap="round">
    <path d="M52 211H185"/><path d="M201 211H229" opacity=".6"/><path d="M244 211H253" opacity=".35"/>
    <path d="M35 33H83M35 33V57M925 543V567H877"/>
