  <g fill="url(#stream)" opacity=".85"><path d="m428 533 14-8 14 8-14 8Z"/><path d="m470 533 14-8 14 8-14 8Z"/><path d="m512 533 14-8 14 8-14 8Z"/></g>
</svg>
